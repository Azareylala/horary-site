<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message envoyé — Traditional Horary Astrology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#b5936b;--cream:#faf8f4;--ink:#1a1814;--muted:#6b6560;--border:#e8e2d8;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',sans-serif;}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}
.symbol{font-size:3rem;color:var(--gold);margin-bottom:2rem}
h1{font-family:var(--serif);font-size:2.5rem;font-weight:300;margin-bottom:1rem}
p{color:var(--muted);font-size:14px;line-height:1.8;max-width:480px;margin-bottom:2rem}
a{display:inline-block;padding:12px 32px;border:0.5px solid var(--ink);color:var(--ink);text-decoration:none;font-size:12px;letter-spacing:.15em;text-transform:uppercase;transition:all .2s}
a:hover{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>
  <div class="symbol">◈</div>
  <h1>Message reçu</h1>
  <p>Merci pour votre question. Je la lirai avec attention et vous répondrai dans un délai de 48 à 72 heures.<br><br>C'est le moment où j'ai lu votre message qui devient le thème horary — la réponse est déjà en cours.</p>
  <a href="/">← Retour au site</a>
</body>
</html>
